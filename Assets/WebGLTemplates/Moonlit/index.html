<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달빛 인쇄소 · 리듬 타이핑</title><meta name="description" content="음악을 따라 달빛 아래, 한 글자씩 책을 쓰는 리듬 타이핑 게임. Unity 6 WebGL."><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080e17;color:#e5d8bc;font-family:system-ui,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw)}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 25% 60%,#2c343d,#101926 75%);z-index:3}h1{font-weight:500;font-size:44px;letter-spacing:.08em}small{color:#8c9eaa;letter-spacing:.25em}#rail{width:280px;height:3px;background:#39434d;margin:24px}#bar{height:3px;width:0;background:#d4b473}p{line-height:1.7;color:#b7b6ad;font-size:14px;text-align:center}#error{max-width:700px;white-space:pre-wrap;color:#ffc09e}#fullscreen{position:absolute;right:12px;bottom:6px;background:#142131aa;color:#dbd6cb;border:1px solid #566270;border-radius:4px;cursor:pointer;font-size:12px;padding:4px 8px;z-index:2}</style></head><body><main id="frame"><canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="달빛 인쇄소 리듬 타이핑 게임"></canvas><section id="loading"><small>MOONLIT PRESS</small><h1>달빛 인쇄소</h1><p>이야기를 깨우는 한밤의 리듬</p><div id="rail"><div id="bar"></div></div><p id="status">서재를 준비하고 있습니다…</p><p id="error"></p></section><button id="fullscreen">전체 화면</button></main><script>const canvas=document.getElementById('unity-canvas');const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Moonlit Press',productName:'달빛 인쇄소',productVersion:'0.5.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message;}};const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('bar').style.width=(p*100)+'%';document.getElementById('status').textContent='서재를 준비하고 있습니다… '+Math.round(p*100)+'%';}).then(instance=>{window.unityInstance=instance;document.getElementById('loading').style.display='none';canvas.focus();document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);}).catch(e=>{document.getElementById('error').textContent=String(e);document.getElementById('status').textContent='불러오지 못했습니다. 새로고침해 주세요.';});script.onerror=()=>document.getElementById('error').textContent='게임 파일을 불러오지 못했습니다.';document.body.appendChild(script);canvas.addEventListener('pointerdown',()=>canvas.focus());</script></body></html>
